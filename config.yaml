energy_bins:
  n_bins: 20
  E_min: 1e4
  E_max: 1e7

E_REF: 1e5

signal:
  phi: 2.06e-18
  gamma: 2.5
  gamma2: 2.8
  E_break: 3e4
  E_cut: 1e6

signal_mese_like:
  # MESE-like reference values at 100 TeV pivot (phi0 units: GeV^-1 cm^-2 s^-1 sr^-1)
  spl:
    phi0_100tev: 2.13e-18
    gamma: 2.55
  bpl:
    phi0_100tev: 2.28e-18
    gamma1: 1.72
    gamma2: 2.84
    E_break: 3.31131121482591e4  # 10^4.52 GeV
  cutoff:
    phi0_100tev: 3.98e-18
    gamma: 2.16
    E_cut: 2.51188643150958e5  # 10^5.40 GeV

background:
  eta: 1.0e-17
  eta_prompt: 2.0e-18
  delta: 3.7

atmospheric_realism:
  model: conv_plus_prompt
  prompt_fraction: 0.15
  delta_prompt: 2.7
  E_knee: 3e5
  knee_sharpness: 4.0
  prompt_prior_log_mean: -40.75338449333246
  prompt_prior_log_sd: 1.0

detector_response:
  mode: hese75_derived
  livetime_years: 7.5
  sigma_log10: 0.15
  physical_flux_units: true
  hese75_aeff_allsky_path: data/icecube/hese75/derived/hese75_effective_area_trueE_allsky.txt
  hese75_migration_path: data/icecube/hese75/derived/hese75_migration_all.txt
  hese75_sky_factor_sr: 12.566370614359172

samplers:
  RWMH:
    n_iterations: 20000
    n_burnin: 5000
    adapt_proposal: true
    adapt_until: 5000
    adapt_interval: 200
    target_accept: 0.234

  MALA:
    n_iterations: 30000
    n_burnin: 10000
    step_size: 1e-4
    adapt_step: true
    adapt_until: 10000
    adapt_interval: 200
    target_accept: 0.57
    precond_type: dense
    normalize_precond: true
    adapt_precond: false

samplers_hierarchical:
  RWMH:
    n_iterations: 100000
    n_burnin: 20000
    adapt_proposal: true
    adapt_until: 20000
    adapt_interval: 200
    target_accept: 0.234

  MALA:
    n_iterations: 100000
    n_burnin: 20000
    step_size: 1e-3
    adapt_step: true
    adapt_until: 20000
    adapt_interval: 200
    target_accept: 0.65
    precond_type: dense
    normalize_precond: true
    adapt_precond: false

priors:
  default: weakly
  physics:
    # Astrophysical single power-law normalization anchor:
    # Phi0 ~= 2.06e-18 GeV^-1 cm^-2 s^-1 sr^-1 at 100 TeV
    # Source: https://doi.org/10.1103/PhysRevD.91.022001
    phi_log_mean: -40.72283611184711
    # Broad weak prior width
    phi_log_sd: 0.8
    # Astrophysical spectral index anchor (rounded around IceCube diffuse fits).
    # Source context: https://doi.org/10.1103/PhysRevD.91.022001
    gamma_mean: 2.5
    # Weakly informative spread
    gamma_sd: 0.4
    eta_log_mean: -39.14394658089878
    # Weakly informative spread
    eta_log_sd: 1.0
    # Conventional atmospheric slope anchor around E^-3.7.
    # Widely used atmospheric-neutrino approximation; HESE context above.
    delta_mean: 3.7
    # Weakly informative spread
    delta_sd: 0.15

hierarchical:
  K: 10
  mu_phi: -40.72283611184711
  sigma_phi: 0.3
  gamma: 2.5
  eta: 1.0e-17
  delta: 3.7
  truth_model: power_law

testing:
  seed_simulator: 42
  seed_posteriors: 42
  seed_samplers: 221
  seed_hierarchical_samplers: 221
  truth_model: power_law
  truth_models: [power_law, broken_power_law, cutoff]
  base_prior_types: [weakly, flat, lognormal_gamma]
  hierarchical_prior_types: [weakly, flat, lognormal_gamma]
  theta_perturb_scale: 0.1
  n_chains: 4
  init_strategy: jitter
  init_scale_base: 0.05
  init_scale_hierarchical: 0.001
  preconditioner_ridge: 1e-6
  hierarchical_parameterization: centered
  latent_display_diagnostics: raw
  latent_display_traceplots: log_phi
  traceplot_rwmh: traceplots_rwmh.png
  traceplot_mala: traceplots_mala.png
  traceplot_hierarchical_rwmh: traceplots_hierarchical_rwmh_centered.png
  traceplot_hierarchical_mala: traceplots_hierarchical_mala_centered.png
